# docx4j-load-survey: the settings docx4j reads while loading, each at docx4j's own default (the
# values of docx4j-samples-resources' reference docx4j.properties), written out so that a row
# measures docx4j as its reference configuration has it. Nothing else is set.
docx4j.jaxb.mc.onLoad=word
docx4j.openpackaging.exceptions.LogBeforeThrow=true
docx4j.openpackaging.parts.MAX_BYTES.unmarshal.error=-1
docx4j.openpackaging.package.MAX_UNCOMPRESSED_SIZE.unzip.error=52428800
docx4j.openpackaging.parts.MAX_BYTES.unzip.error=52428800
docx4j.openpackaging.parts.MAX_RATIO.unzip.error=500
docx4j.openpackaging.parts.JaxbXmlPartXPathAware.binder.eager.MainDocumentPart=false
docx4j.openpackaging.parts.JaxbXmlPartXPathAware.binder.eager.OtherParts=false
