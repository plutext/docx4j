##############################
# docx4j-fo.properties: PDF output via XSL FO (docx4j-export-fo).
#
# Optional.  Read from the classpath after docx4j.properties, and only for the keys
# docx4j.properties does not set: a key set there wins over the same key here, and a key
# set programmatically (Docx4jProperties.setProperty) wins over both.  Every property here
# has a default in the code, which the commented-out lines show, so a deployment without
# this file gets the same PDF output; it exists so that docx4j.properties need not carry
# the renderer settings and the Word layout rules' opt-outs and tunings, which a
# deployment rarely changes.  A key outside docx4j.convert.out.fo is honoured but logged.
# The rules themselves, with the Word measurement behind each, are in
# docx4j-export-fo/docs/word-layout-rules.md (section 1.5 lists the opt-outs).
# @since 17.2.0
##############################

# @since 8.3.3
#docx4j.convert.out.fop.FopConfParser.defaultBaseURI=[your absolute URI]

# Apache Fop's FopFactory caches font configuration;
# docx4j typically configures fonts on a per document basis
# (which is necessary if fonts are embedded in the document).
# So if you want to re-use FopFactory (as Apache recommends),
# set this property to true to have docx4j manage Fop's fonts
# each time PDF export is invoked.
# Defaults to true.
# (An alternative is to configure Fop with a "global" font config)
# @since 11.5.14 
docx4j.convert.out.fo.renderers.ConfiguredPDFDocumentHandler=true

# Automatic hyphenation in PDF output via XSL FO.
#
# @since 17.1.0, a document hyphenates when it asks to: w:settings/w:autoHyphenation,
# with Word's rules applied - w:hyphenationZone (the largest gap tolerated at the end of
# a line before the next word is hyphenated), w:consecutiveHyphenLimit,
# w:doNotHyphenateCaps, and w:pPr/w:suppressAutoHyphens per paragraph.  Leave this
# property UNSET (comment it out) for that.
#
# Set it to override the document: true hyphenates every paragraph which does not
# suppress hyphenation (what the property did from 8.3.3 to 17.0.5), false hyphenates
# nothing whatever the document says.
#
# Either way, FOP needs hyphenation patterns, which neither FOP nor docx4j ships:
# see https://xmlgraphics.apache.org/fop/2.11/hyphenation.html.  The usual source is
# net.sf.offo:fop-hyph, which is not under the Apache licence, so add it to your own
# classpath.  Without patterns nothing is hyphenated, whatever this says.
#docx4j.convert.out.fo.hyphenate=false

# Kerning.  Word kerns a run only when w:kern is present with a threshold at or below the
# run's size (its default template kerns only the Title style), whereas FOP kerns every
# font that has a kern table; the difference moves line breaks (a kerned line can be a
# fraction of a point shorter, so a word Word wraps stays on the line).  With the default
# (false) fonts are configured unkerned plus a kerned twin ("<name>+kern") that runs Word
# kerns are sent to; true kerns everything, as before 17.0.5.
# since docx4j 17.0.5; defaults to false
#docx4j.convert.out.fo.kerning=false

# Ligatures.  Word applies no standard OpenType ligature unless the run asks for one
# (w14:ligatures), whereas FOP applies the GSUB "liga" feature to every font that has it.
# In Calibri (and Carlito) that makes "ti" and "tt" ligature glyphs which have no Unicode
# of their own, so the PDF's text cannot be extracted, searched or read by a screen
# reader.  With the default (false) each TrueType font is also declared with no OpenType
# features at all ("<name>+noliga", FOP encoding-mode="single-byte") and runs of Latin
# text which ask for neither ligatures nor kerning are sent to it; true applies the
# features to everything, as before 17.0.5.
# since docx4j 17.0.5; defaults to false
#docx4j.convert.out.fo.ligatures=false

# Word's spacing rules in PDF output via XSL FO, applied to the generated FO: a hard page
# break's paragraph merged into the next (compatibility mode 15), contextual spacing, HTML
# auto spacing, space before at the top of a page, exact-height table rows, superscripts
# not enlarging the line, the line box and baseline of each paragraph.  Set to false to
# skip them (the FO is then as docx4j 17.0.4 produced it).
# since docx4j 17.0.5; defaults to true
#docx4j.convert.out.fo.wordLayoutFixups=false

# Whether a picture Word wraps text around may be rendered as an fo:float in PDF output
# via XSL FO.  FOP's side floats are unreliable: a float of any height followed by content
# which overflows the page (a table row taller than the space left, say) makes it throw
# java.util.NoSuchElementException from LMiter.next, and the export fails.  Set this false
# to lay such pictures out in the flow instead (no text beside them, but the export
# completes).  Read when the FO writer registry is first created.  Text boxes are never
# floats, whatever this says.
# since docx4j 17.0.5; defaults to true
#docx4j.convert.out.fo.pictures.float=false

# A floating table's position (w:tblPr/w:tblpPr) in PDF output via XSL FO: the grid edge
# goes at w:tblpX (or where w:tblpXSpec says) within the frame w:horzAnchor names, and a
# table whose vertical position Word measures from the page or from the margin box, and
# which opens its section, is placed there in an absolutely positioned block-container -
# the cover page and the letterhead.  Set this false to lay every table out in the flow,
# as docx4j 17.0.5 did.
# since docx4j 17.1.0; defaults to true
#docx4j.convert.out.fo.tables.position=false

# A paragraph's w:pPr/w:framePr - Word's positioned text frames - in PDF output via XSL FO.
# A frame anchored to the page or to the margin is lifted out of the flow into an
# absolutely positioned block-container at w:x / w:y of width w:w, consecutive paragraphs
# carrying the same w:framePr forming one frame; where its w:wrap says no text may run
# beside it (notBeside, none) the flow keeps the frame's band, as Word does.  A
# w:vAnchor="text" frame and a w:dropCap are laid out in the flow.  Set this false to lay
# every framed paragraph out where it falls, as docx4j 17.0.5 did.
# since docx4j 17.1.0; defaults to true
#docx4j.convert.out.fo.frames.position=false

# A floating table anchored to the text (w:tblpPr with the default w:vertAnchor="text")
# becomes an fo:float at the paragraph it is anchored to, so the text runs beside it as it
# does in Word, w:leftFromText / w:rightFromText away.  Set this false to lay such a table
# out in the flow instead, with the text after it rather than beside it - which is what
# 17.0.5 did, and what you want if you hit one of FOP's float defects.  A table too wide
# for text to fit beside it, and one in a multi-column section, is left in the flow anyway.
# since docx4j 17.1.0; defaults to true
#docx4j.convert.out.fo.tables.float=false

# A wide floating table anchored by w:tblpY in the lower half of the page, with
# content before it in the flow, is positioned at its anchor and an invisible
# copy left where it was, so the text that follows is pushed past its band as
# Word pushes it (17.1.0).  false leaves such a table in the flow.
docx4j.convert.out.fo.tables.reserveBand=true

# Whether the columns the content-autofit pass computed are scaled down to the text column
# when their minima overflow it (word-layout-rules.md §6.5).  Word does the same: its own
# kept w:tblGrid for a 36-column corpus table sums to the text column where the content
# minima sum to 2.8 times it.  false leaves such a table at its minima, overhanging the
# page; measured, that gave back a 311-page document's whole gain (0.8462 -> 0.7953).
# since docx4j 17.2.0; defaults to true
#docx4j.convert.out.fo.tables.scaleContentAutofit=false

# Where the content-autofit column sizer takes a column's minimum width from: its
# widest run between the line manager's break opportunities (UAX #14 as FOP applies
# it, with Word's rules for the solidus), so that a URL is measured to its ? and its
# hyphens, where the line manager and Word both break it, rather than whole.  Measured,
# a 117-character URL measured whole gave its column 286pt where Word gives 216 and
# starved the column beside it to 44pt (Word: 77), which then broke a word there a
# letter to a line.  false measures the widest white-space-delimited token, as 17.1.0 did.
# since docx4j 17.2.0; defaults to true
#docx4j.convert.out.fo.tables.minimumAtBreakOpportunities=false

# How tall the header and footer regions are made in PDF output via XSL FO.  Word sizes a
# header or footer on its in-flow paragraphs: an anchored (floating) drawing in one is
# positioned out of the flow and does not make the region taller, so the body is not
# pushed down by the picture's height.  Only the measuring pass is affected - the picture
# is still painted and positioned.  Set this false to have a floating drawing in a header
# or footer reserve its height, as docx4j 17.0.5 did.
# since docx4j 17.1.0; defaults to true
#docx4j.convert.out.fo.headerExtent.ignoreFloatingObjects=false

# Word-style layout in PDF output via XSL FO: FOP layout managers (in docx4j-export-fo,
# package org.docx4j.fop.wordlayout) which break lines greedily as Word does and place
# each line in Word's text box, instead of FOP's Knuth-Plass breaking and centred leading.
# Set to false to restore plain FOP layout.
# since docx4j 17.0.5; defaults to true
#docx4j.convert.out.fo.wordLayout=false

# How far the spaces of a justified line may be compressed to pull one more word in, as a
# fraction of their natural width (Word compresses to about 3/4); only used when Word-style
# layout is on.  0.24 is the value at which the measured probe breaks 98% of its lines as
# Word does (0.20 gives 78%, 0.30 gives 74%).
# since docx4j 17.0.5; defaults to 0.24
#docx4j.convert.out.fo.wordLayout.maxSpaceShrink=0.24

# The same, but for taking a longer *hyphenation fragment* - the piece of a word which stays
# on the line - rather than for pulling a whole word in.  Word pays much less for one:
# measured against its own PDFs it accepted fragments costing 1.2% and 6.0% of the line's
# spaces and refused 13.5%, 14.5%, 22.0% and 25.6%.  Capped by maxSpaceShrink.
# since docx4j 17.1.0; defaults to 0.10
#docx4j.convert.out.fo.wordLayout.maxHyphenSpaceShrink=0.10

# Whether w:hyphenationZone is enforced as the largest gap left at a line end before Word
# hyphenates the next word, which is what docx4j did up to 17.0.5.  Measured against Word 365
# on the same prose at zones of 18pt and 36pt, the zone never fires: Word broke every line
# identically and hyphenated gaps of 16.7pt to 34.1pt inside the 36pt zone.
# since docx4j 17.1.0; defaults to false
#docx4j.convert.out.fo.wordLayout.hyphenationZone=true

# How loose the alternative line has to be before a justified line is compressed to pull one
# more word onto it, as a fraction of the spaces' natural width.  Being inside maxSpaceShrink
# is not enough: measured on three corpus lines, Word refused compressions of 22.5%, 15.1%
# and 13.3% and took an alternative stretched by only 38.5%, 16.1% and 12.8%, while the lines
# it did compress had far looser alternatives.  0 restores 17.0.5's behaviour.
# since docx4j 17.1.0; defaults to 0.30
#docx4j.convert.out.fo.wordLayout.minStretchToCompress=0.30

# A word no legal break can fit on a line - a URL, a long compound - is given a
# line of its own and broken at the character where the measure falls, with no
# hyphen, as Word breaks it (17.1.0).  Only where the word overruns the measure
# by more than an inch; false leaves the word overflowing as FOP does.
#docx4j.convert.out.fo.wordLayout.emergencyBreak=true

# How far past the measure, in points, such a word may run before it is broken.
# The rule has to be conservative: a word which does not fit is often a measure we got
# wrong rather than a word Word breaks, and breaking it then hides the real defect.
# Measured over three corpora, 8 is worth about +0.004 of mean line parity over 72 -
# but it breaks the page count of three documents whose columns we size wrongly, where
# it fires 166 times into measures of 5 and 23 points.  Lower it once those columns are
# right.  since docx4j 17.2.0; defaults to 72 (one inch)
#docx4j.convert.out.fo.wordLayout.emergencyBreakTolerance=72

# The same inside a table cell.  Word breaks a word as soon as it exceeds the cell it is in,
# at whatever character reaches the edge - measured, a 21.55pt column breaks
# "Categorizador/Período" down 15 lines of one or two characters - so in a cell the
# tolerance is one twip (0.05pt), Word's own unit of layout, rather than the inch; the inch
# left such a word on one line running across its neighbours and off the page.  This is a
# workaround for FOP, which has no intra-word break at all: docx4j's own line manager
# splits the word into per-character pieces (no character is added to the text), and the
# workaround goes when FOP grows an emergency break of its own.  A split word loses its
# kerning and glyph positioning, and a cell whose column we have sized narrower than Word
# did now breaks a word Word fitted; 72 breaks in cells as sparingly as in body text
# (17.1.0's behaviour).  Capped by emergencyBreakTolerance.
# since docx4j 17.2.0; defaults to 0.05
#docx4j.convert.out.fo.wordLayout.cellEmergencyBreakTolerance=0.05

# The cell tolerance as a fraction of the cell's measure; the larger of it and the points
# above applies.  Measured over the three corpora at 0.02 (and the points at 2 and 3): none
# of them recovers a page count the twip loses, because the words those documents break are
# 5 to 60 points over their columns, not a few per cent - see word-layout-rules.md §6.11.
# since docx4j 17.2.0; defaults to 0
#docx4j.convert.out.fo.wordLayout.cellEmergencyBreakToleranceRatio=0.02

# Word applies w:keepNext locally: where a paragraph and the next do not fit on a page
# together the keep is ignored at that point.  FOP writes a keep as an infinite penalty and
# has no rule for a run of them longer than a page - it puts the whole run on one page and
# lets it overrun (measured, 1037 lines to y=7693.5 on a 792pt page; two documents of one
# corpus are 52 pages short of Word for this alone).  true bounds such a chain: while the
# height since the last break the breaker may take exceeds the page, that chain's keeps are
# reduced to keepChainPenalty, so the breaker may break inside it - and, the penalty still
# being large, breaks there only where it must.  A keep chain which fits is untouched.
# since docx4j 17.1.0; defaults to true
#docx4j.convert.out.fo.wordLayout.boundKeepChains=false

# The penalty an unsatisfiable keep is reduced to, against FOP's infinite 1000.
# since docx4j 17.1.0; defaults to 900
#docx4j.convert.out.fo.wordLayout.keepChainPenalty=900

# How many times the page a keep chain must exceed before it is bounded.  The height
# summed at flow level over-estimates what the page must hold (a table's rows are boxes
# beside the block holding them; line heights each a little tall accumulate), so a chain
# only somewhat over the page is one Word fits: measured, a chain 12% over cost a 71-page
# document its 72nd page, while at 3x both that document and the 1037-line overflow come
# out at Word's own page count exactly.
# since docx4j 17.1.0; defaults to 3.0
#docx4j.convert.out.fo.wordLayout.keepChainTolerance=3.0

# A w:br whose new line holds nothing that paints - an empty run, a field with no
# result, an empty field - still takes a line box, at the paragraph's line height, as
# Word gives it.  Measured on a paragraph of five breaks whose fields have no result:
# Word runs y=200.7 to 293.9 (six line boxes) where docx4j ran 200.5 to 247.3, three
# lines and 46.5pt lost.  A break followed immediately by another break is already
# right and is left alone.  false restores 17.0.5's behaviour.
# since docx4j 17.1.0; defaults to true
#docx4j.convert.out.fo.wordLayout.emptyLineAfterBreak=false

# Word justifies the line that ends at a soft return (a w:br with no type) inside a
# w:jc="both" paragraph, exactly as it justifies any other line of it - unless the
# document sets w:compat/w:doNotExpandShiftReturn, which Word 2007 and earlier write
# and Word 2010 and later do not.  docx4j had the flag-on behaviour for every document,
# because a w:br is written as a nested fo:block and the line before it is therefore a
# last line, which FOP start-aligns.  false restores 17.0.5's behaviour.
# since docx4j 17.1.0; defaults to true
#docx4j.convert.out.fo.wordLayout.justifySoftReturn=false

# FOP truncates every glyph advance to a whole 1/1000 em when it builds a font's
# width table (OpenFont.convertTTFUnit2PDFUnit divides), so each line it measures
# and the /Widths it writes are up to half a unit per glyph short of the font;
# Word writes the rounded widths and measures with the exact advances.  docx4j
# corrects FOP's width tables to the rounded values as each font loads (17.1.0);
# false leaves FOP's truncated tables.
#docx4j.convert.out.fo.glyphWidths.round=true

# Whether a NUMPAGES field anywhere makes the PDF conversion two-pass, so that the page count
# is written as a literal (as Word prints it) rather than as an fo:page-number-citation-last,
# for which FOP reserves the width of "MMM" while breaking the line - measured, that wrapped a
# footer line Word keeps on one, and cost the body 53.5pt on every page.  Set to false to keep
# the single pass where the second render costs too much.
# since docx4j 17.1.0; defaults to true
#docx4j.convert.out.fo.twoPassForNumpages=false

# A section whose w:pgNumType/@w:start is one XSL-FO forbids (0 - Word's usual way of
# writing a cover page that is "page 0") lays out as folio 1, because FOP clamps
# initial-page-number to at least 1, so the odd-or-even page-master alternatives select
# the wrong master: measured, every header of such a document was on the wrong side of the
# page.  The ODD and EVEN alternatives are swapped from that section on to compensate.
# (The printed PAGE number stays one too high; nothing in XSL-FO offsets fo:page-number.)
# since docx4j 17.1.0; defaults to true
#docx4j.convert.out.fo.pgNumType.oddEvenParityFix=false

# w:settings/w:mirrorMargins: Word calls w:pgMar/@w:left the inside margin and @w:right the
# outside one, so on an even (left-hand) page they swap.  Each page master gains a mirrored
# twin, selected on even pages.  Measured on a 42-page document whose sectPr say
# w:left="2268" w:right="1418": Word's even pages start at x=70.8 and ours at 113.4.
# since docx4j 17.1.0; defaults to true
#docx4j.convert.out.fo.mirrorMargins=false
