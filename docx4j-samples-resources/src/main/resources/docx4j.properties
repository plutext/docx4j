##############################
# docx setup

# XHTMLImporter needs to know how to convert pixel measurements
# This is read by UnitsOfMeasurement
docx4j.DPI=96

# Page size: use a value from org.docx4j.model.structure.PageSizePaper enum
# eg A4, LETTER
docx4j.PageSize=LETTER
# Page size: use a value from org.docx4j.model.structure.MarginsWellKnown enum
docx4j.PageMargins=NORMAL
docx4j.PageOrientationLandscape=false

# These will be injected into docProps/app.xml
# if App.Write=true; as of 6.1 this is only done for new documents, in order to preserve whatever was there already
docx4j.App.write=true
docx4j.Application=docx4j
docx4j.AppVersion=17.2
# of the form XX.YYYY where X and Y represent numerical values
# WARNING: -SNAPSHOT will cause Word 2010 x64 to treat the docx as corrupt! 
# so we set it here, instead of using Version.getDocx4jVersion()

# These will be injected into docProps/core.xml; creator is only set if not already present (lastModifiedBy is fair game)
docx4j.dc.write=true
#docx4j.dc.creator.value=docx4j
#docx4j.dc.lastModifiedBy.value=docx4j

# Since docx4j 17.0.0, deepCopy clones JAXB objects using copy methods in each object, 
# since this is much faster than marshalling and unmarshalling.
# Set this property to true if you need the old behaviour.   
# @since 17.0.0
docx4j.XmlUtils.deepCopy.classic=false

# By default, docx4j often logs an error before re-throwing, for easier diagnosis.  
# After v3.3.2, this property allowed you to stop that logging if you want 
# In v6.1.0, most of these log events were removed
# https://github.com/plutext/docx4j/pull/329
# so this property is now only used in our XSLT LoggingErrorListener  
docx4j.openpackaging.exceptions.LogBeforeThrow=true

# If this is set to true, the cyclic styles  
# (ie styles which refer to themselves, directly or indirectly)
# detector will throw a CyclicStylesException.  Defaults to false.
# @since 11.5.14
#docx4j.openpackaging.exceptions.CyclicStylesException.throw=true

# If this is set to a positive value, docx4j will throw
# a PartTooLarge exception if a part being unmarshalled from a zip file is
# larger than the set value.  Purpose is to avoid unmarshalling
# files which will take too long (eg a 300MB document.xml part).
# Setting this still allows the docx to be unzipped, in case there
# are things you want to do with it  (short of unmarshalling this part) 
# since docx4j 6.0.0
docx4j.openpackaging.parts.MAX_BYTES.unmarshal.error=-1

##############################
# zip-bomb defenses
# If triggered, these prevent this docx from being opened at all.  

# If this is set to a positive value, docx4j will throw
# a FileTooLarge exception if the total size of the uncompressed data
# loaded from a zip file is larger than the set value.  
# since docx4j 11.5.6
docx4j.openpackaging.package.MAX_UNCOMPRESSED_SIZE.unzip.error=52428800

# If this is set to a positive value, docx4j will throw
# a PartTooLarge exception if a part being loaded from a zip file is
# larger than the set value.  
# since docx4j 6.0.0
docx4j.openpackaging.parts.MAX_BYTES.unzip.error=52428800
# named so could potentially have unzip.warn

# A normal compressed file rarely has a ratio greater than 100:1. 
# You can set a reasonable maximum ratio (e.g., 500:1 or 1000:1) and 
# abort the process if any entry's ratio exceeds this limit. 
# While this is a good secondary check, it's not foolproof, 
# as an attacker could forge the header to report a false uncompressed size. 
# If this is set to a positive value, docx4j will throw
# a PartTooLarge exception if a part being loaded from a File 
# (File only, not an InputStream) has a compression
# ratio larger than the set value. 
# since docx4j 11.5.6
docx4j.openpackaging.parts.MAX_RATIO.unzip.error=500

##############################
# pptx setup

# Powerpoint 2010 (32-bit) can't play eg WMV if it is compressed.
# (though 64-bit version is fine). 
# since docx4j 11.5.6 (2026 03) OleObjectBinaryPart is compressed by default
# (this property defaults to true).
# if you have an OLE type which needs to stay uncompressed, please report your use case.
# As a workaround you can uncomment/set this to false, but note this affects all 
# OLE parts and typically results in larger file sizes. 
# docx4j.openpackaging.io3.stores.ZipPartStore.shouldCompress.OleObjectBinaryPart=false

# Page size: use a value from org.pptx4j.model.SlideSizesWellKnown enum
# eg A4, LETTER
pptx4j.PageSize=LETTER
pptx4j.PageOrientationLandscape=true

pptx4j.openpackaging.packages.PresentationMLPackage.DefaultTheme=org/docx4j/openpackaging/parts/PresentationML/theme.xml

# docx4j-documents4j-local, docx4j-documents4j-remote:  
# documents4j now supports pptx to PDF,
# however PowerPoint must run in the foreground, which opens PowerPoint 
# on the executing machine which can cause problems in some environments.
# For docx4j-documents4j-local, you can disable it here, 
# by setting this to false. 
# (Typically you would disable it if it is causing problems
#  and you are only doing docx or xlsx conversions, for which it isn't required)
# For docx4j-documents4j-remote, this setting is not relevant, 
# since powerpoint conversion only works if you specifically enable it
# when you start the remote server, for example:
# java -jar documents4j-server-standalone-1.1.8-shaded.jar http://192.168.0.33:9998
#      --enable com.documents4j.conversion.msoffice.MicrosoftPowerpointBridge
# @since docx4j 8.3.2
pptx4j.documents4j.MicrosoftPowerpointBridge.enabled=true

##############################
# docx4j general config

# Use output method "xml" (as opposed to "html")
docx4j.Convert.Out.HTML.OutputMethodXML=true

# convert a bookmark to anchor (a), @id (id), or ignore (null)
# defaults to anchor. @since 3.2.1 
docx4j.Convert.Out.HTML.BookmarkStartWriter.mapTo=a

# If false, throw an exception if something is encountered which
# output processing is unable to handle.  TODO fully implement this.
docx4j.Convert.Out.Lossy=true

# documents4j for PDF output, TOC update, and importing, either a local instance or remote
# To use, add either docx4j-documents4j-local or docx4j-documents4j-remote to your classpath
# then configure below 
# @since 8.2.0 
# local config: 
#docx4j.convert.out.documents4j.local.tmpDir=C:\\Users\\name\\tmp_docuj
#com.documents4j.conversion.msoffice.word_convert.vbs=C:\\Users\\name\\git\\docx4j\\docx4j-samples-resources\\src\\main\\resources\\documents4j_word_convert.vbs

# remote config: 
#docx4j.convert.out.documents4j.remote.tmpDir=/home/name/tmp_docuj
#docx4j.convert.out.documents4j.remote.Uri=http://192.168.0.31:9998

# PDF output via XSL FO (docx4j.convert.out.fo.*, and docx4j.convert.out.fop.*): the
# renderer settings, the Word layout rules' opt-outs and their tunings - which a deployment
# rarely changes - live in docx4j-fo.properties beside this file.  That file is optional,
# read from the classpath after this one, and supplies only the keys this file does not
# set: a key here wins over the same key there.  @since 17.2.0

# HTML font-family.  The span for a run names the document font first, then the family
# of the physical font this machine mapped it to, then the generic class -
# font-family: 'Calibri','Carlito',sans-serif; - as Word's own HTML and browsers expect,
# since the reader's browser is not on the server.  "physical" restores the output before
# 17.2.0 (the physical font alone, and nothing where the document font mapped to none),
# for HTML rendered on the server itself.
# since docx4j 17.2.0; defaults to document
#docx4j.convert.out.html.fontFamily=document

# Whether docx4j deletes the image files it wrote into a directory it chose itself.
# A conversion which needs image files (PDF via XSL FO, HTML) writes one per picture
# per run; where you don't set an imageDirPath (FOSettings/HTMLSettings), they go to
# java.io.tmpdir with a UUID in the name.  Nothing used to delete them, so a long
# running process filled its temp directory.  For PDF they are deleted as soon as FOP
# has rendered; for HTML, and for FO output (FOSettings.INTERNAL_FO_MIME, or a dumped
# fo file), the document you get still points at them, so they are registered with
# File.deleteOnExit() instead.  Images written to an imageDirPath YOU named are your
# output, and are never deleted whatever this says.
# since docx4j 17.2.0; defaults to true
#docx4j.convert.out.images.deleteTemporary=false

# Windows metafile (WMF, EMF, EMF+) pictures.  Since 17.1.0 docx4j draws them itself,
# in pure Java, by replaying their GDI records: as SVG in PDF output via XSL FO
# (fo:instream-foreign-object) and in HTML where the image handler embeds images, and
# as a PNG otherwise.  The SVG generator is Batik's, which comes with docx4j-export-fo;
# without that module on the classpath a metafile is always a PNG in HTML.
#
# Resolution the PNG is rasterised at, in pixels per inch.  96 is the Windows screen
# resolution metafiles are usually authored at; raise it for a sharper (larger) image.
# since docx4j 17.1.0; defaults to 96
#docx4j.convert.out.metafile.dpi=96

# Whether the text inside a metafile is emitted as glyph outlines rather than SVG <text>.
# As <text> (the default) it is still text in the PDF - searchable, selectable - and FOP
# resolves the font; the face names come from the metafile itself and are mapped through
# docx4j's PhysicalFonts.  Set this true for a rendering identical to AWT's whatever
# fonts are installed, at the cost of searchable text and a larger file.
# since docx4j 17.1.0; defaults to false
#docx4j.convert.out.metafile.textAsShapes=true

# Hidden text (w:vanish) is not rendered, and takes no space, as Word prints it.  Word's
# "print hidden text" is an application printing option, not part of the docx, so it is a
# property here.  Applies to PDF (via XSL FO) and HTML.
# since docx4j 17.0.5; defaults to false
#docx4j.convert.out.printHiddenText=true

# Word's single line height is a whole number of 1/600 inch (its A4 page is
# 4961 x 7016 such units); rounding docx4j's line pitch to that grid measured
# worse over the corpora (Word rounds the accumulated position, not the pitch),
# so it is off by default (17.1.0).
#docx4j.fonts.wordLineMetrics.deviceGrid=false

# A complex field with no w:fldChar w:fldCharType="separate" has no result (ECMA-376
# 17.16.18), so Word paints nothing for it.  For an IF field that is how Word writes a
# conditional block of a footer - IF { PAGE } = { NUMPAGES } "..." "" - with the true
# branch, table and all, in w:instrText: we painted the operands' own PAGE and NUMPAGES
# fields and reserved the branch's height, costing 65pt of body on every page of one
# document.  Restricted to IF: PAGE, FORMCHECKBOX, MERGEFIELD and XE are also written
# without a separate and we do render those.  PDF and HTML.
# since docx4j 17.1.0; defaults to true
#docx4j.convert.out.fields.dropResultlessIf=false

# A legacy form field - FORMDROPDOWN, FORMTEXT, FORMCHECKBOX - keeps its state in the
# w:ffData of its w:fldChar w:fldCharType="begin", and Word paints that state rather than
# the field result, which is often empty.  Measured, a drop-down whose w:ddList has no
# w:result is painted by Word as its first w:listEntry: measured, Word's line runs
# 297.7..413.6 where docx4j's began at 302.7 and ended at 378.3, the entry missing.
# A FORMTEXT with nothing typed into it shows its w:textInput/w:default; one which has a
# result keeps it.  A checkbox is left alone: Word draws it as a stroked square path with
# nothing in the PDF's text layer, so no character is written for it.  PDF and HTML.
# since docx4j 17.1.0; defaults to true
#docx4j.convert.out.fields.formFieldResults=false

# Word does not re-evaluate a DOCPROPERTY when it opens or prints a document: it paints
# the result the field cached, and only an explicit update changes it.  Measured on a
# document whose docProps/custom.xml and cached results have diverged, Word prints the
# cached text.  false evaluates the property instead, which is what docx4j did before
# 17.1.0.  PDF and HTML.
# since docx4j 17.1.0; defaults to true
#docx4j.convert.out.fields.docPropertyCachedResult=false

# Whether a DATE or TIME field is painted as the result the document stores for it
# (true) or read from the clock at conversion (false, the default, as always).  Word
# rewrites both whenever it opens a document, update or no update, so what a file stores
# is the date Word last touched it and what Word's PDF paints is the date of the
# conversion: a comparison of docx4j's output against a Word PDF cut on another day
# differs on every such line for no reason of layout, and true holds docx4j to the
# file's own date - which is also what makes a conversion reproducible.  Deliberately
# narrow: PAGE, NUMPAGES, SECTIONPAGES, PAGEREF and PRINTDATE are ones Word evaluates
# whatever its update setting (measured with the update off: a header field storing one
# number prints "Page 1" to "Page 14", a table of contents whose entries all store "3"
# prints 3, 4, 4, 5, ..., and a PRINTDATE storing 00. XXX. 0000 prints the day's date),
# so their stored result is not what any Word output shows and they stay evaluated;
# DOCPROPERTY has the property above.  A field with no stored result at all is still
# evaluated.  PDF and HTML.
# since docx4j 17.2.0; defaults to false
#docx4j.convert.out.fields.dateCachedResult=true

# Which mc:Choice of an mc:AlternateContent to render, as a space-separated list of the
# @Requires prefixes we can draw; the first mc:Choice naming only those wins, and otherwise
# the mc:Fallback is used as before.  Word draws the first mc:Choice whose @Requires names
# a namespace it understands (ECMA-376 Part 3, 10.2.1) and reaches the fallback only when
# it understands none of them.  Empty (the default) always takes the fallback, as docx4j
# always has: measured over the 25 corpus documents carrying an mc:Choice Requires="wps",
# choosing it moved two and both fell, the Choice's box landing within 0.6pt of the
# fallback's in each.  Set it where a document's fallback is missing or wrong.
# The one switch for every format and every reader (CR-021): PDF and HTML, TraversalUtil
# in its default one-branch walk, text extraction, markdown, and PresentationML's slide
# walks and SVG export - a PowerPoint equation or ink shape sits in a Choice
# Requires="a14" with a picture Fallback, so a14 here draws the shape, not the picture.
# since docx4j 17.1.0; defaults to empty
#docx4j.jaxb.mc.preferChoice=wps

# Whether the leading and trailing white space of a w:t which does not carry
# xml:space="preserve" is discarded, as Word discards it - xml:space is what makes it
# significant, and Word writes the attribute whenever the space matters.  Measured: a
# centred line was 3.9pt wide of Word's and started 3.9pt left of it.  This is the w:t
# emission path, not the load path, so a document read and written back is unchanged.
# PDF and HTML.
# since docx4j 17.1.0; defaults to true
#docx4j.fonts.runFontSelector.trimUnpreservedWhitespace=false

# @since 3.3.0 default PDF output *and* docx ToC page number generation 
# was via Plutext's now retired commercial converter
# (if you want to use FOP, just put docx4j-export-fo and its dependencies
#  on your classpath)
# Set the URL of the endpoint here.  
# Since 6.1.0, the default is http://127.0.0.1:9016/v1/00000000-0000-0000-0000-000000000000/convert 
# (which will only work if you download and install the converter there) 
# Set this property to point at some other instance.

# In 6.1.0, docx4j checks bookmarks are OK (ie no duplicates, no missing starts or ends), 
# before using them for ToC operations.
# The default behaviour is to throw an exception if any bookmarks are broken.  
# Set this to try to have docx4j fix them. It does this by DELETING broken bookmarks.
# A future version might instead try to be more graceful, by inserting missing starts or ends nearby.
# @since 6.1.0
docx4j.toc.BookmarksIntegrity.remediate=false

# If true, parse 12/04/2012 as 4 December 
docx4j.Fields.Dates.DateFormatInferencer.USA=false

# A (non-Word-standard) percent format for fields which multiplies 
# the value by hundred (as java formatting does)
# For example, when set to true, formatting 0.33 with "\\# ##%" yields 33%.
# See further FormattingSwitchHelperNumericTests
# Defaults to false (preserving existing behavior).
# @since 6.1.2
docx4j.Fields.Numbers.JavaStylePercentHandling=false

# What to treat as the decimal point when converting a string
# to a number.  Fallback only, 
# used if the docx itself does not contain a setting for
#    <w:decimalSymbol />
docx4j.Fields.Numbers.DecimalSymbol=.
# What character may be used to group thousands
docx4j.Fields.Numbers.GroupingSeparator=,
# What character may be used to separate styles and levels in \t switch field argument
docx4j.Fields.TOC.SwitchT.Separator=,

# docx4j.fonts settings which follow
# are primarily for export-fo output

# Font cache location, used if set.
# If the value points to an existing directory, DEFAULT_CACHE_FILENAME is used within that directory. 
# Otherwise the value is treated as the complete cache file path.
# If not set, try user.home, then tmpDir, then relative path
# See further org.docx4j.fonts.fop.fonts.FontCache
# and see also property docx4j.openpackaging.parts.WordprocessingML.ObfuscatedFontPart.tmpFontDir
# @since 17.0.0
# docx4j.fonts.fontcache=/path/to/docx4j-fonts.cache

# Whether to look for fonts in file system
# @since 11.5.8, defaults to true
docx4j.fonts.discoverPhysicalFonts.enabled=true

# Whether to look for fonts in jars
# @since 11.5.8, defaults to true
docx4j.fonts.discoverJarFonts.enabled=true

# The path prefix to use when looking inside jars for fonts
# @since 11.5.8, defaults to fonts
docx4j.fonts.PhysicalFonts.Jars.PathPrefix=fonts

# Whether to automatically map Calibri to Carlito, Cambria to Caladea etc 
# @since 11.5.9, defaults to true
docx4j.fonts.automap.enabled=true

# Directories whose fonts docx4j reads for their METRICS ONLY: it may measure a document
# font from one of these files and will never draw in it, and they are not discovered as
# physical fonts.  Separated by the platform's path separator; absent by default (off).
#
# What it is for: some layout decisions turn on how wide the document's OWN face is, not
# how wide the substitute is.  Word sets a Symbol arrowdblright bullet 0.987 em wide at
# 11pt (218 twips) and its numbering tab therefore passes a tab stop at 1548 twips; the
# face a Linux box substitutes is 0.838 em, ends 11 twips short of that stop, and the tab
# takes it - putting the line 8.25pt left of Word's.  Point this at a copy of the
# authoring machine's font folder and the label is measured in Symbol itself, while every
# glyph on the page is still drawn in whatever it was drawn in before.
# Only faces this machine has NOT got are consulted: where docx4j has the face it draws
# in it, and the measurement is already the document's own.
# @since 17.2.0
#docx4j.fonts.metricsOnly.dirs=/path/to/fonts:/another/path

# Which Office theme docx4j supplies where a document asks for a theme font and its
# package has NO theme part, and which theme part WordprocessingMLPackage.createPackage
# puts in a new package.  Word gives such a document its own default theme, and which
# faces that names has changed twice; this says which version of Word a themeless
# document is read as having come from:
#   2023        Aptos Display / Aptos      Word 365 (the default)
#   2013        Calibri Light / Calibri    Office 2013 to 2022
#   2007        Cambria / Calibri          Office 2007 to 2010; docx4j's answer up to 17.1.0
# Measured on a Word 365 rendering of a package with no theme part: at 11pt the minor
# slot advances 58.865pt over ten digits and 137.923pt over a-z, which is Aptos and not
# the 55.28 / 130.32 of an explicit Calibri on the same page.  Only the two Latin slots
# are answered; the Office theme's East Asian and complex-script entries are empty.
# @since 17.2.0, defaults to 2023
docx4j.fonts.defaultTheme=2023

# Whether a font this machine does not have may be resolved through the w:altName
# the document's own fontTable.xml gives it (ECMA-376 17.8.3.1, "the font to use when
# this one is unavailable"), which is what Word does.  Consulted after the metrically
# compatible substitutes above and before the class-based ones.
# @since 17.1.0, defaults to true
docx4j.fonts.altName.enabled=true

# What a conversion via XSL FO says about the document's fonts: one line per document
# font naming what it is drawn in, how close that is (EXACT, NEAR, CLASS, NONE) and what
# to do about it - INFO for a font this machine has or a metric clone of it, WARN for the
# rest.  'full' logs the whole report (the use of each font, the decision, the fontTable's
# evidence about the machine that saved the document); 'off' logs nothing.  The same report
# is available as org.docx4j.fonts.FontsAnalysis.analyse(pkg), and from a command line.
# @since 17.2.0, defaults to summary
docx4j.fonts.report.log=summary

# Embedded fonts are supposed to be obfuscated, but some producers (eg Google Docs)
# don't do that.  Set this to true if you want docx4j to obfuscate them.
# This is only done if FontTablePart's processEmbeddings() is invoked.
# @since 17.0.0, defaults to false
docx4j.fonts.embedded.obfuscate=false

# PDF output; ability to specify font substitutions.  See src/samples/_resources
# Avoid using both this and fontMapper.getFontMappings() for the same fonts!
# since docx4j 3.2.0
#docx4j.fonts.fop.util.FopConfigUtil.substitutions=fop-substitutions.xml

# Use FOP's "simulate-style" attribute to generates bold and oblique looking glyphs for PDF output
# where those font variations are not available.  Useful for Chinese (eg PMingLiU) which lacks a bold variant,
# and certain English language fonts including Franklin Gothic Book 
# since docx4j 8.3.0; defaults to false
# since docx4j 11.5.8; defaults to true
docx4j.fonts.fop.util.FopConfigUtil.simulate-style=true

# Defaults to org/docx4j/fonts/microsoft/MicrosoftFonts.xml
# which is contained in the docx4j jar
# If you need to override it in order to provide different file names for
# one or more fonts, start by extracting and editing a copy of the existing file
docx4j.fonts.microsoft.MicrosoftFonts=org/docx4j/fonts/microsoft/MicrosoftFonts.xml
# since docx4j 11.5.10, you can supplement the main file with another
#docx4j.fonts.microsoft.MicrosoftFonts.supplemental=MicrosoftFonts-supplemental.xml

# Emoji font: specify which installed font to substitute for use with emoji glyphs,
# for example, Segoe UI Emoji (on Windows), or Apple Color Emoji (on OSX) 
# TODO get Noto Color Emoji working 
# since docx4j 8.2.7
#docx4j.fonts.RunFontSelector.EmojiFont=Segoe UI Emoji

# In XHTML import, span/@style='background-color:red;' would usually become w:rPr/w:shd/@w:fill="ff0000"
# Set this to true to use w:highlight instead 
docx4j.model.properties.PropertyFactory.createPropertyFromCssName.background-color.useHighlightInRPr=true

# Whether to System.gc() before attempting to delete tmp image files.
# Introduced in docx4j 3.  For consistency with previous versions, default is true 
docx4j.openpackaging.parts.WordprocessingML.BinaryPartAbstractImage.TempFiles.ForceGC=true

# Unmarshalling via a DOM document (for XPath binder) can be 5x slower than
# unmarshalling an input stream directly!
# This setting lets you avoid eager unmarshalling via DOM, unless you know you'll be using XPath
# (XPath should still work either way, but creating the binder is deferred where eager=false)
# since docx4j 3.3.0
docx4j.openpackaging.parts.JaxbXmlPartXPathAware.binder.eager.MainDocumentPart=false
docx4j.openpackaging.parts.JaxbXmlPartXPathAware.binder.eager.OtherParts=false

# This override available since docx4j 3.2.0
# Defaults to org/docx4j/jaxb/mc-preprocessor.xslt
# which you can find in docx4j-core/src/main/resources
#docx4j.jaxb.JaxbValidationEventHandler=custom-preprocessor.xslt

# A list of parts to transform before unmarshalling is 
# first attempted; use comma-separated partnames.  Useful when you
# know your input docx always have issues owing to
# deficiencies in whatever application emitted them
# (eg Google Docs, SQLServer Reporting Service (SSRS) 2012, BIRT).
# since docx4j 11.4.7
#docx4j.jaxb.preprocess.always=MainDocumentPart,StyleDefinitionsPart,FooterPart

# Whether to pretty print XML parts (defaults to true)
# since docx4j 3.2.0
docx4j.jaxb.formatted.output=true
# in 3.3.x this only works if docx4j.jaxb.marshal.canonicalize=false

# Whether to canonicalize during marshalling (defaults to false).  
# This is mainly for aesthetic purposes: the Sun/Oracle JAXB reference implementation
# writes a lot of unnecessary namespaces (each one in the JAXB context?).  MOXy is better.
# Set this to true to get rid of them via an extra step: canonicalization 
# since docx4j 3.3.1
docx4j.jaxb.marshal.canonicalize=false

# docx4j, since v6.0, writes a comment to the Main Document Part which identifies
# what version it was produced with.  Use this property to suppress that.
# since docx4j 6.1
docx4j.jaxb.marshal.suppressVersionComment=false

# docx4j, in v6.0 (and unlike earlier versions), marshalled to OutputStream via XMLStreamWriter.
# In 6.1, the default is again to marshall directly to the specified OutputStream.
# The option to marshal via XMLStreamWriter (like in v6.0) is provided here, but its
# probably not useful until such time as we provide a way for the user to use their own XMLStreamWriter.
# since docx4j 6.1
docx4j.openpackaging.parts.JaxbXmlPart.MarshalToOutputStreamViaXMLStreamWriter=false

# Convert unsupported image types to png for adding as png.
# @since 17.0.1, no conversion will be attempted if this property is not set, or is set to an empty string
# For ImageMagick, use 'magick'; for GraphicsMagick, use 'gm convert'
docx4j.openpackaging.parts.WordprocessingML.BinaryPartAbstractImage.ImageMagickExecutable=

# If  <artifactId>imageio-webp</artifactId> is on your classpath/modulepath,
# docx4j can write WebP images to docx.  If you want to convert them to png instead, set this property to "convertToPng"
# For conversion to png to work, you need ImageMagick or GraphicsMagick configured 
# Defaults to true.
# @since 17.0.1
docx4j.openpackaging.parts.WordprocessingML.ImageWebPPart.enabled=true

# The styles part content used by WordprocessingMLPackage createPackage
# and by getStyleDefinitionsPart(true) where the styles part is null
