# OpenDoPE

# In 6.1.0, OpenDoPE component processing is done before condition/repeat processing.
# But it is turned off by default. If you want to use components, set this to true
# (you will need Enterprise jar on your classpath)
# @since 6.1.0
docx4j.model.datastorage.OpenDoPEHandlerComponents.enabled=false

# Whether to use the "quick n dirty" heuristic to treat some results as 
# boolean or int without allowing an exception to happen first. 
# Defaults to true.  True may be quicker.  False may be better for your XPaths.
# Advanced users may wish to try both. Please report your results in the forum. 
docx4j.openpackaging.parts.XmlPart.cachedXPathGetString.heuristic=true

# An XPath result is converted to a boolean.  
# This property determines whether that is done using XPath 1 or 2 or Java.  
# Set to true or cast1 to convert to boolean using XPath 1.0 conversion rules.
# If false, Java's rules will be used.  A key difference is
# how strings are handled.  XPath 1.0 rules treat any non-empty string
# as true!  For example, the string 'false' evaluates to true.
# But, XPath's conversion rule for a node-set is convenient:
# it is true if and only if it is non-empty.
# Defaults to false, matching previous behaviour. 
# @since 11.5.5
# false means use Java
opendope.conditions.Xpathref.XPathBoolean=false
# cast1 or true means use XPath 1.0
# cast2 means use XPath 2.0
# Recommended setting for new implementations is cast2
#opendope.conditions.Xpathref.XPathBoolean=cast2

# The following setting is likely ignored if you are not using Saxon
# Saxon 8.5 and later use XPath 2.0+ strict type checking
# and so do not allow you to compare xs:boolean to xs:string
# ie an equality test with xs:boolean on one side and xs:string on the other.
# To work around this issue for legacy XPath 1 based documents
# set this property to cast1 or cast2.
# This will cast the right hand side of the expression so the type checking does not fail.
# Default is strict type checking without casting
#docx4j.openpackaging.parts.XmlPart.xpath2.typechecking=strict
# Use XPath 2.0 semantics: a string can only be cast to xs:boolean if its lexical value is exactly "true", "false", "1", or "0" (case-sensitive)
# Expect an exception if the string value is something else
docx4j.openpackaging.parts.XmlPart.xpath2.typechecking=cast2
# Use XPath 1.0 semantics: any non-empty string is true
#docx4j.openpackaging.parts.XmlPart.xpath2.typechecking=cast1
# Recommended setting for new implementations is cast2

# Whether to use the XSLT or non-XSLT or StAX implementation for the binding step.
# All three implementations have feature parity as of 17.0.4 (see BindingHandler's
# javadoc, and docs/developer/change-requests/CR-001-binding-traverser-parity.md for
# benchmarks).
# - BindingTraverserNonXSLT (the default since 17.0.4): fastest on every
#   workload benchmarked; the recommended choice for most workloads.
# - BindingTraverserXSLT (the default before 17.0.4): longest-serving;
#   XSLT-level customisation of bind.xslt is possible.  Slowest and heaviest
#   on every workload benchmarked.
# - BindingTraverserStAX: best where documents are large, bindings sparse, and
#   the result is saved rather than further processed in memory - roughly half
#   NonXSLT's peak heap, insensitive to heap pressure, near-free save.  Slowest
#   on binding-dense documents.
# The property also controls whether StAX is used for the preprocessing step
# (it will only be used if the part is not already unmarshalled).
docx4j.model.datastorage.BindingHandler.Implementation=BindingTraverserNonXSLT
#docx4j.model.datastorage.BindingHandler.Implementation=BindingTraverserStAX

# Everything in the SDT rPr is applied
# (Selecting the SDT in Word and applying direct formatting is the easiest way to configure the SDT rPr).
# This setting determines whether the rPr or direct XHTML formatting have priority.
# Set to true if you don't control the XHTML formatting and you want its
# appearance harmonised with the docx.  Defaults to false.
# Note experimental: you can specify paragraph formatting by using a character style with a linked paragraph style
# though this does not render as expected in the Word UI!
# (since 11.5.12)
docx4j.model.datastorage.BindingTraverser.XHTML.PrioritiseRPr=false

# The XHTML importer's FormattingOption for runs, paragraphs and tables
# (docx4j-ImportXHTML's XHTMLImporterImpl.setRunFormatting etc) when it is used
# for OpenDoPE XHTML binding.  Values: CLASS_TO_STYLE_ONLY (a Word style matching
# @class is used, and nothing else), CLASS_PLUS_OTHER (the importer's default:
# @class to style, plus other CSS as direct formatting), IGNORE_CLASS (CSS as
# direct formatting only).  Unset = the importer's default.
# Notes for CLASS_TO_STYLE_ONLY:
# - @class must name a style *id* (eg IntenseEmphasis, not "Intense Emphasis") of
#   the right type (character/paragraph/table); only the first token is used.
# - ParagraphFormatting=CLASS_TO_STYLE_ONLY: an ol/ul without a @class naming a
#   numbering style gets NO numbering; put the @class on every ol/ul level.
# - Fonts: needs docx4j-ImportXHTML 17.2.0+; earlier versions always emit w:rFonts
#   from CSS font-family, whatever the option.
# - Not useful with PrioritiseRPr=true (that route sets pStyle on every imported
#   paragraph, overriding the @class-derived one).  With PrioritiseRPr=false, the
#   CSS docx4j would derive from the SDT's rPr/pPr is simply not generated.
# For anything beyond these three settings, see BindingHandler.setXHTMLImporterCustomizer.
# (since 17.2.0; see docs/developer/change-requests/CR-013)
#docx4j.model.datastorage.BindingTraverser.XHTML.RunFormatting=CLASS_TO_STYLE_ONLY
#docx4j.model.datastorage.BindingTraverser.XHTML.ParagraphFormatting=CLASS_TO_STYLE_ONLY
#docx4j.model.datastorage.BindingTraverser.XHTML.TableFormatting=CLASS_TO_STYLE_ONLY

# Deprecated
# For block level XHTML content, apply the paragraph style
# linked to w:sdtPr/w:rPr/w:rStyle (if any).
# This is how Word allows you to specify pPr, there is no w:sdtPr/w:pPr. 
# Note: this does not even apply direct w:sdtPr/w:rPr 
# UNLESS:
# (1) there is w:sdtPr/w:rPr/w:rStyle, and
# (2) that w:rStyle has a linked pStyle. 
# (defaults to false).  
# Deprecated
docx4j.model.datastorage.BindingTraverser.XHTML.Block.rStyle.Adopt=false

# For BindingTraverserXSLT, which xslt?
docx4j.model.datastorage.BindingTraverserXSLT.xslt=org/docx4j/model/datastorage/bind.xslt

# if a validation event occurs, causing probable loss of content,
# whether to produce output or not.  Default is false (consistent with previous behaviour).
# (since 3.3.6)
docx4j.model.datastorage.BindingTraverserXSLT.ValidationEventContinue=false

# .. placeholder to use instead of "Click here to enter text" 
# Defaults to OpenDoPE/placeholder.xml, and if nothing is there,
# will fallback to org/docx4j/model/datastorage/placeholder.xml (which is in the docx4j jar)
#docx4j.model.datastorage.placeholder=OpenDoPE/placeholder.xml

# RemovalHandler can remove certain content controls from the output docx 
# (retaining their contents).  With this property you can replace the XSLT which is used to do this.
# (since 6.1.0)
#docx4j.model.datastorage.RemovalHandler.xslt=org/docx4j/model/datastorage/RemovalHandler.xslt

# Specify the SDTs RemovalHandler should remove. Historically the Docx4j facade has used Quantifier ALL,
# so that's the default here.  
# (since 6.1.0)
#docx4j.model.datastorage.RemovalHandler.Quantifier=ALL_BUT_PLACEHOLDERS

# You can set this to false if you don't use OpenDoPEReverter; it omits some empty content controls from the BindlingHandler
# step, so it may speed processing up marginally, and make ODH's output easier to read.  Defaults to true. 
docx4j.model.datastorage.OpenDoPEReverter.Supported=true

# Old versions of Word (2007, 2010) can't handle an SdtPr/w:tag value longer than 64 chars
# If this flag is enabled (default is true), docx4j will warn when a long tag is encountered.
# (NOT IMPLEMENTED IN v8)
#docx4j.wml.SdtPr.Tag.LengthExceeds64Warning=true

# These affect the output of numbers in Arabic; see further RunFontSelector
# For further discussion, please see http://www.docx4java.org/forums/pdf-output-f27/arabic-number-digits-in-pdf-output-t1826.html
# Value can be 'Context'|'National'
docx4j.MicrosoftWindows.Region.Format.Numbers.NativeDigits=National
# Value can be 'Hindi'|'Context'|'Arabic'|'System'; default is Arabic ie 1234
docx4j.MicrosoftWord.Numeral=Arabic

# Whether events are published asynchronously (in which case order is not guaranteed).  Default is false. 
docx4j.events.Docx4jEvent.PublishAsync=false

# Provides default toc style definitions,
# for use if none are defined in the docx itself.
docx4j.toc.TocStyles.xml=org/docx4j/toc/TocStyles.xml

